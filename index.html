<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a3a32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kniffel-Assistent</title>
<style>
:root{
  --felt-dark:#0f241f; --felt:#1a3a32; --felt-2:#2a4b41; --felt-3:#356055;
  --ivory:#f6f1e3; --paper:#f7f5ee; --paper-2:#ece9dc; --ink:#17233f; --soft:#6a7491;
  --line:#e3e0d2; --gold:#e0b04a; --gold-h:#edc263; --red:#c4402f;
  --good:#2c8a58; --good-bg:#d6eddf; --bad:#a8372b; --bad-bg:#f6ddd8; --neutral-bg:#e9e6d8;
  --tint:#faf1d4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--felt-dark);color:var(--ink);
  font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.35;
  overscroll-behavior-y:contain}
body{min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:not-allowed}
.num{font-variant-numeric:tabular-nums}
.die,.pad button,.sortchip{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* ---------- Einrichtung ---------- */
.setup{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px;
  padding-top:max(24px,env(safe-area-inset-top))}
.setup .card{background:var(--felt);border-radius:24px;padding:28px 22px;color:var(--ivory);
  box-shadow:inset 0 0 0 1px #2d5a50}
.setup h1{margin:6px 0 4px;font-size:30px;font-weight:700;text-align:center;letter-spacing:.2px}
.setup .sub{margin:0 0 22px;text-align:center;color:#b7d0c6;font-size:17px}
.setup .dicerow{display:flex;justify-content:center;gap:6px;margin-bottom:6px}
.setup .dicerow svg{width:44px;height:44px}
.countrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.countrow button,.vbtn{background:var(--felt-2);color:var(--ivory);border-radius:16px;min-height:60px;font-size:26px;font-weight:700}
.countrow button.on,.vbtn.on{background:var(--gold);color:#2a2006}
.vbtn{display:block;width:100%;text-align:left;padding:14px 16px;font-size:20px;margin-bottom:10px;min-height:0}
.vbtn small{display:block;font-size:14px;font-weight:400;margin-top:4px;opacity:.85}
.field{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.field label{width:76px;color:#b7d0c6;font-size:15px}
.field input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid #3f6b5f;
  background:var(--ivory);color:#1b1b1b;outline:none}
.field input:focus{border-color:var(--gold)}
.row2{display:flex;gap:10px;margin-top:20px}
.btn{border-radius:14px;padding:13px 18px;font-weight:600;font-size:16px;min-height:48px;text-align:center}
.btn.gold{background:var(--gold);color:#2a2006}
.btn.gold:active{background:var(--gold-h)}
.btn.felt{background:var(--felt-2);color:#e6efe9}
.btn.ink{background:var(--ink);color:#fff}
.btn.soft{background:#ebe8db;color:var(--ink)}
.btn.wide{flex:1}
.btn.big{width:100%;margin-top:22px;font-size:18px;min-height:54px}
.resume p{margin:4px 0;text-align:center;color:#d3e4dc}

/* ---------- Spiel ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;
  padding-top:max(10px,env(safe-area-inset-top));color:#9cc3b5}
.bar h2{margin:0;font-size:18px;font-weight:600}
.bar .ibtns{display:flex;gap:6px}
.ibtn{background:var(--felt-2);color:#e6efe9;border-radius:12px;min-width:44px;height:40px;padding:0 12px;font-size:14px;font-weight:600}
.ibtn:disabled{opacity:.35}

#panel{position:sticky;top:0;z-index:5;padding:0 10px 8px;background:var(--felt-dark)}
.panel{background:var(--felt);border-radius:20px;padding:12px 12px 10px;
  color:var(--ivory);box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 0 0 1px #2d5a50}
.phead{display:flex;align-items:center;gap:10px}
.pname{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%}
.dots{display:flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:#3e645a}
.dots i.on{background:var(--gold)}
.pround{margin-left:auto;font-size:12px;color:#8fb5a8;text-align:right}
.dice{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 8px}
.die{position:relative;aspect-ratio:1;border-radius:18%;padding:0;background:none;touch-action:manipulation;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.die svg{width:100%;height:100%;display:block}
.die.sel{outline:3px solid var(--gold);outline-offset:3px}
.die.roll svg{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-6deg) scale(1.03)}50%{transform:rotate(5deg) scale(.97)}100%{transform:rotate(-6deg) scale(1.03)}}
.tags{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:-2px;margin-bottom:6px}
.tags span{font-size:11px;text-align:center;color:#9fbfb3;min-height:14px}
.tags span.keep{color:#ffa898;font-weight:600}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:8px}
.pad button{background:var(--felt-2);color:#e6efe9;border-radius:12px;min-height:46px;font-size:20px;font-weight:700}
.pad button:active{background:var(--gold);color:#2a2006}
.acts{display:flex;gap:8px}
.acts .btn{min-height:46px;padding:10px 12px;font-size:15px}
.acts .btn.small{flex:0 0 52px;padding:0}
.status{margin-top:8px;font-size:13px;color:#cfe0d9;min-height:2.6em}

.tabs{display:flex;gap:6px;margin:14px 10px 10px;background:var(--felt);padding:4px;border-radius:16px}
.tabs button{flex:1;min-height:44px;border-radius:12px;color:#b7d0c6;font-weight:600;font-size:15px}
.tabs button.on{background:var(--paper);color:var(--ink)}
.content{margin:0 10px 28px}

.note{color:#b7d0c6;font-size:13px;margin:0 2px 10px}
.sortrow{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.sortrow::-webkit-scrollbar{display:none}
.sortchip{flex:0 0 auto;background:var(--felt-2);color:#d7e6df;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;min-height:38px}
.sortchip.on{background:var(--paper);color:var(--ink)}
.sortchip.info{background:transparent;border:1.5px solid #4c7b6f;color:#9fc4b6}

.card{background:var(--paper);border-radius:18px;padding:14px 14px 12px;margin-bottom:10px;border:2px solid transparent}
.card.top{border-color:#6fb28d}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cname{font-size:18px;font-weight:700;color:var(--ink)}
.cshort{font-size:12.5px;color:var(--soft)}
.cnow{text-align:right;line-height:1}
.cnow b{font-size:28px;font-weight:700;color:var(--ink)}
.cnow span{display:block;font-size:11px;color:var(--soft);margin-top:2px}
.metric{display:flex;align-items:center;gap:10px;margin-top:10px}
.metric .mp{font-size:19px;font-weight:700;min-width:70px}
.bar2{flex:1;height:8px;border-radius:5px;background:#e8e5d7;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--good);border-radius:5px}
.chip{font-size:13px;font-weight:700;border-radius:12px;padding:3px 10px}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:var(--neutral-bg);color:var(--soft)}
.chip.muted{background:#ebe8dc;color:#9aa1b5}
.sub{font-size:13px;color:var(--soft);margin-top:3px}
.rec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:15px}
.rec a{color:#2d5fb0;font-weight:600;text-decoration:underline;font-size:14px;padding:6px 4px}
.rec .ok{color:var(--good);font-weight:600;font-size:14px}
.selrow{margin-top:6px;padding:8px 10px;background:var(--paper-2);border-radius:12px;font-size:13px;color:var(--ink);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cbtns{display:flex;gap:8px;margin-top:12px}
.cbtns .btn{min-height:46px;padding:10px 12px;font-size:15px}
.cbtns .btn.main{flex:1}
.chance{background:var(--paper-2)}
.empty{background:var(--paper);border-radius:18px;padding:18px;color:var(--soft);font-size:15px}

/* ---------- Punkteblock ---------- */
.boardwrap{background:var(--paper);border-radius:18px;padding:8px 6px;overflow-x:auto}
table.board{border-collapse:collapse;width:100%;min-width:100%}
.board th,.board td{padding:9px 6px;text-align:center;font-size:15px}
.board th{font-size:13px;font-weight:700;color:var(--soft);position:sticky;top:0}
.board th:first-child,.board td:first-child{text-align:left;position:sticky;left:0;background:var(--paper);padding-left:10px;white-space:nowrap}
.board tr:nth-child(even) td{background:#f1eee3}
.board tr:nth-child(even) td:first-child{background:#f1eee3}
.board td.cur,.board th.cur{background:var(--tint)!important;color:var(--ink)}
.board td.open{color:#8c95ad;font-weight:600}
.board td.click{cursor:pointer;outline:2px dashed #e0b04a;outline-offset:-4px;border-radius:8px}
.board td.struck{color:#b9bdca}
.board tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.board tr.total td{font-weight:700;font-size:17px}
.bonusbox{margin:12px 4px 2px;font-size:13px;color:var(--soft)}
.bonusbar{height:8px;background:#e4e1d2;border-radius:5px;margin-top:6px;overflow:hidden}
.bonusbar i{display:block;height:100%;background:var(--gold)}
.hint{margin:10px 6px 0;font-size:12px;color:var(--soft)}

/* ---------- Sheet / Toast ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;
  animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet p{margin:4px 0 12px;color:var(--soft);font-size:15px}
.sheet .btn{display:block;width:100%;margin-top:8px}
.sheet dl{margin:8px 0 0}
.sheet dt{font-weight:700;margin-top:12px}
.sheet dd{margin:2px 0 0;color:#454e68;font-size:14.5px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;display:none;
  background:#17233f;color:#fff;border-radius:14px;padding:12px 14px;font-size:15px;align-items:center;gap:10px}
#toast.show{display:flex}
#toast span{flex:1}
#toast button{color:var(--gold);font-weight:700;padding:6px 8px}
.langlist .vbtn{font-size:20px;padding:15px 18px;margin-bottom:8px}
#app{overflow-x:clip}
.slideR{animation:inR .22s ease-out}
.slideL{animation:inL .22s ease-out}
@keyframes inR{from{transform:translateX(36px);opacity:.25}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-36px);opacity:.25}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   Logik: Kategorien und Spielvarianten
   ===================================================================== */
const BONUS_LIMIT = 63, BONUS_POINTS = 35, REACH = 0.25, MAX_PLAYERS = 6, MAX_NAME = 14;
const cntOf = d => { const c = [0,0,0,0,0,0,0]; for (const v of d) c[v]++; return c; };
const sumOf = d => d.reduce((a, b) => a + b, 0);
const maxCount = d => Math.max(...cntOf(d).slice(1));
const hasRun = (d, n) => { const s = new Set(d);
  for (let a = 1; a + n - 1 <= 6; a++) { let ok = true; for (let k = a; k < a + n; k++) if (!s.has(k)) { ok = false; break; } if (ok) return true; }
  return false; };
const pairScore = d => { const c = cntOf(d); for (let v = 6; v >= 1; v--) if (c[v] >= 2) return 2 * v; return 0; };
const fullHouse = d => { const c = cntOf(d).slice(1).filter(x => x > 0).sort((a, b) => a - b);
  return (c.length === 2 && c[0] === 2 && c[1] === 3) ? 25 : 0; };
const paschAlt = (d, n) => { const c = cntOf(d); for (let v = 6; v >= 1; v--) if (c[v] >= n) return n * v; return 0; };


function makeCats(variant) {
  const alt = variant === "alt", cats = [];
  const names = ["Einser", "Zweier", "Dreier", "Vierer", "Fünfer", "Sechser"];
  names.forEach((nm, i) => { const n = i + 1;
    cats.push({ id: "u" + n, name: nm, short: "Ziel: mind. 3× die " + n, upper: true,
      score: d => n * cntOf(d)[n], good: d => cntOf(d)[n] >= 3 }); });
  if (alt) {
    cats.push({ id: "pair", name: "Ein Paar", short: "Ziel: Paar aus 5ern oder 6ern", score: pairScore, good: d => pairScore(d) >= 10 });
    cats.push({ id: "p3", name: "Dreierpasch", short: "Ziel: 3× Fünfer oder Sechser", score: d => paschAlt(d, 3), good: d => paschAlt(d, 3) >= 15 });
    cats.push({ id: "p4", name: "Viererpasch", short: "Ziel: 4× Vierer, Fünfer, Sechser", score: d => paschAlt(d, 4), good: d => paschAlt(d, 4) >= 16 });
  } else {
    cats.push({ id: "p3", name: "Dreierpasch", short: "Ziel: Summe ab 20", score: d => maxCount(d) >= 3 ? sumOf(d) : 0, good: d => maxCount(d) >= 3 && sumOf(d) >= 20 });
    cats.push({ id: "p4", name: "Viererpasch", short: "Ziel: Summe ab 18", score: d => maxCount(d) >= 4 ? sumOf(d) : 0, good: d => maxCount(d) >= 4 && sumOf(d) >= 18 });
  }
  cats.push({ id: "fh", name: "Full House", short: "25 Punkte", score: fullHouse, good: d => fullHouse(d) > 0 });
  cats.push({ id: "ks", name: "Kleine Straße", short: "30 Punkte", score: d => hasRun(d, 4) ? 30 : 0, good: d => hasRun(d, 4) });
  cats.push({ id: "gs", name: "Große Straße", short: "40 Punkte", score: d => hasRun(d, 5) ? 40 : 0, good: d => hasRun(d, 5) });
  cats.push({ id: "kn", name: "Kniffel", short: "50 Punkte", score: d => maxCount(d) === 5 ? 50 : 0, good: d => maxCount(d) === 5 });
  cats.push({ id: "ch", name: "Chance", short: "Summe aller Augen", notnagel: true, score: d => sumOf(d), good: d => sumOf(d) >= 22 });
  cats.forEach((c, i) => { c.order = i; c.variant = variant; });
  return cats;
}
const CATLISTS = { classic: makeCats("classic"), alt: makeCats("alt") };
const CATMAPS = {}; for (const v in CATLISTS) { CATMAPS[v] = {}; CATLISTS[v].forEach(c => CATMAPS[v][c.id] = c); }

/* =====================================================================
   Logik: Wahrscheinlichkeiten (exakt, dynamische Programmierung)
   ===================================================================== */
const STATES = [], SIDX = new Map();
for (let a = 1; a <= 6; a++) for (let b = a; b <= 6; b++) for (let c = b; c <= 6; c++) for (let d = c; d <= 6; d++) for (let e = d; e <= 6; e++) {
  SIDX.set("" + a + b + c + d + e, STATES.length); STATES.push([a, b, c, d, e]); }
const keyOf = arr => [...arr].sort((x, y) => x - y).join("");
const KEPT_ARR = new Map();           // Schlüssel -> Array
const KEEPS = STATES.map(d => { const m = new Map();
  for (let mask = 0; mask < 32; mask++) { const kept = d.filter((_, i) => (mask >> i) & 1); const k = kept.join("");
    if (!m.has(k)) { m.set(k, kept); KEPT_ARR.set(k, kept); } }
  return [...m.keys()]; });
const KEPTS = [...KEPT_ARR.keys()];
const DIST = new Map();
for (const k of KEPTS) { const kept = KEPT_ARR.get(k), n = 5 - kept.length, total = Math.pow(6, n), acc = new Map();
  for (let i = 0; i < total; i++) { let x = i; const all = kept.slice();
    for (let j = 0; j < n; j++) { all.push(x % 6 + 1); x = Math.floor(x / 6); }
    const si = SIDX.get(keyOf(all)); acc.set(si, (acc.get(si) || 0) + 1); }
  const outs = [...acc.keys()]; DIST.set(k, { outs, probs: outs.map(o => acc.get(o) / total) }); }

function buildTable(cat) {
  const E = [STATES.map(d => cat.score(d))], P = [STATES.map(d => cat.good(d) ? 1 : 0)], B = [null], KVE = {}, KVP = {};
  for (let r = 1; r <= 2; r++) {
    const kve = {}, kvp = {};
    for (const k of KEPTS) { const { outs, probs } = DIST.get(k);
      if (KEPT_ARR.get(k).length === 5) { kve[k] = E[0][outs[0]]; kvp[k] = P[0][outs[0]]; }
      else { let e = 0, p = 0; for (let j = 0; j < outs.length; j++) { e += probs[j] * E[r-1][outs[j]]; p += probs[j] * P[r-1][outs[j]]; } kve[k] = e; kvp[k] = p; } }
    const er = [], pr = [], br = [];
    for (let s = 0; s < STATES.length; s++) { let best = null;
      for (const k of KEEPS[s]) { const ve = kve[k], vp = kvp[k];
        if (best === null || ve > best.e + 1e-9 || (Math.abs(ve - best.e) <= 1e-9 && (vp > best.p + 1e-9 || (Math.abs(vp - best.p) <= 1e-9 && k.length < best.k.length)))) best = { e: ve, p: vp, k }; }
      er.push(best.e); pr.push(best.p); br.push(best.k); }
    E.push(er); P.push(pr); B.push(br); KVE[r] = kve; KVP[r] = kvp;
  }
  let par = 0; { const { outs, probs } = DIST.get(""); for (let j = 0; j < outs.length; j++) par += probs[j] * E[2][outs[j]]; }
  return { E, P, B, KVE, KVP, par };
}
const TABLES = {};
function tableFor(cat) { const k = cat.variant + ":" + cat.id; return TABLES[k] || (TABLES[k] = buildTable(cat)); }

function evalSelection(t, s, r, keptKey) {
  if (r === 0) return [t.P[0][s], t.E[0][s]];
  return [t.KVP[r][keptKey], t.KVE[r][keptKey]];
}
function keptKeyOf(dice, keep) { return dice.filter((v, i) => keep[i]).sort((a, b) => a - b).join(""); }

function analyse(dice, rollNo, keep, openCats) {
  const sd = [...dice].sort((a, b) => a - b), s = SIDX.get(sd.join("")), r = 3 - rollNo, kk = keptKeyOf(dice, keep), rows = [];
  for (const c of openCats) { if (c.notnagel) continue;
    const t = tableFor(c), now = c.score(sd);
    const row = { cat: c, now, now_w: now - t.par, par: t.par, good: !!c.good(sd) };
    if (r > 0) { row.bp = t.P[r][s]; row.be = t.E[r][s]; row.rec = KEPT_ARR.get(t.B[r][s]); row.bw = row.be - t.par;
      const [sp, se] = evalSelection(t, s, r, kk); row.sp = sp; row.se = se; row.sw = se - t.par; }
    rows.push(row); }
  return rows;
}

const CHAINS = [["kn", "p4", "p3", "pair"], ["gs", "ks"]];
const FAMILY = new Set(["u1","u2","u3","u4","u5","u6","pair","p3","p4","kn"]);
const PASCH = ["kn", "p4", "p3", "pair"];

function smartOrder(rows, r, hasLocks) {
  const pre = hasLocks ? "s" : "b";
  const val = x => r === 0 ? x.now_w : x[pre + "w"];
  const chance = x => r === 0 ? 0 : x[pre + "p"];
  const reachable = x => x.good || chance(x) >= REACH;
  const cmp = r === 0
    ? (a, b) => (b.good - a.good) || (val(b) - val(a)) || (b.now - a.now)
    : (a, b) => (val(b) - val(a)) || (chance(b) - chance(a)) || (b.now - a.now);
  const order = [...rows].sort(cmp);
  const byid = {}; order.forEach(x => byid[x.cat.id] = x);
  const ids = order.map(x => x.cat.id);
  const chainPass = () => { let changed = false;
    for (const chain of CHAINS) { const members = chain.filter(c => byid[c]);
      members.forEach((hi, hi_i) => { if (!reachable(byid[hi])) return;
        for (const lo of members.slice(hi_i + 1)) if (ids.indexOf(hi) > ids.indexOf(lo)) { ids.splice(ids.indexOf(hi), 1); ids.splice(ids.indexOf(lo), 0, hi); changed = true; } }); }
    return changed; };
  const guardPass = () => { let changed = false;
    for (const a of [...ids]) { if (!FAMILY.has(a) || !byid[a].good) continue;
      for (const b of [...ids]) { if (b === a || !FAMILY.has(b) || byid[b].good) continue;
        if (PASCH.includes(a) && PASCH.includes(b)) continue;
        if (ids.indexOf(a) > ids.indexOf(b)) { ids.splice(ids.indexOf(a), 1); ids.splice(ids.indexOf(b), 0, a); changed = true; } } }
    return changed; };
  for (let i = 0; i < 8; i++) { const c1 = chainPass(), c2 = guardPass(); if (!(c1 || c2)) break; }

function orderRows(rows, r, hasLocks, key, desc) {
  if (key === "auto") { const res = smartOrder(rows, r, hasLocks); return desc ? res : res.reverse(); }
  const dir = desc ? -1 : 1;
  if (key === "name") return [...rows].sort((a, b) => dir * (a.cat.order - b.cat.order));
  if (key === "now") return [...rows].sort((a, b) => dir * (a.now - b.now) || (b.now_w - a.now_w));
  const pre = hasLocks ? "s" : "b", m = key.slice(1);
  const f = r === 0 ? (x => x.now_w) : (x => x[pre + m]);
  const sec = r === 0 ? (x => x.now) : (x => x[pre + "w"]);
  return [...rows].sort((a, b) => dir * (f(a) - f(b)) || (sec(b) - sec(a)));
}

function chanceInfo(dice, rollNo, keep, cat) {
  const sd = [...dice].sort((a, b) => a - b), s = SIDX.get(sd.join("")), r = 3 - rollNo, info = { now: cat.score(sd) };
  if (r > 0) { const t = tableFor(cat); info.best_e = t.E[r][s]; info.sel_e = evalSelection(t, s, r, keptKeyOf(dice, keep))[1]; }
  return info;
}

const newGame = (names, variant) => Object.assign({ variant, players: names.map(n => ({ name: n, scores: {} })), current: 0, history: [] }, blankTurn());
const catsOf = g => CATLISTS[g.variant];
const catOf = (g, id) => CATMAPS[g.variant][id];
const isComplete = g => g.dice.every(v => v > 0);
const openCats = (g, pi) => catsOf(g).filter(c => !(c.id in g.players[pi === undefined ? g.current : pi].scores));
const isFinished = g => g.players.every(p => Object.keys(p.scores).length === catsOf(g).length);
function totals(g, pi) { const sc = g.players[pi].scores; let up = 0, low = 0;
  for (const c of catsOf(g)) if (c.id in sc) { if (c.upper) up += sc[c.id][0]; else low += sc[c.id][0]; }
  const bonus = up >= BONUS_LIMIT ? BONUS_POINTS : 0; return { up, bonus, low, total: up + bonus + low }; }
function saveGame() { try { if (G) localStorage.setItem(STORE, JSON.stringify(G)); } catch (e) {} }
function loadGame() { try { const g = JSON.parse(localStorage.getItem(STORE) || "null");
  if (g && CATLISTS[g.variant] && Array.isArray(g.players) && g.players.length >= 1 && g.players.length <= MAX_PLAYERS && g.dice && g.dice.length === 5 && g.rollNo >= 1 && g.rollNo <= 3) {
    g.players.forEach(p => { for (const k of Object.keys(p.scores)) if (!CATMAPS[g.variant][k]) delete p.scores[k]; }); return g; } } catch (e) {} return null; }

let LANG = "de";
function t(key, ...a) {
  const d = L[LANG] || L.de; let s = d[key] !== undefined ? d[key] : (L.de[key] !== undefined ? L.de[key] : key);
  return s.replace(/\{(\d+)\}/g, (m, i) => a[+i] !== undefined ? a[+i] : "");
}
function detectLang() {
  try { const s = localStorage.getItem(LSTORE); if (s && L[s]) return s; } catch (e) {}
  const n = ((navigator.language || "de") + "").slice(0, 2).toLowerCase(); return L[n] ? n : "de";
}
const catName = c => t("cat." + c.id);
const catShort = c => c.upper ? t("short.upper", c.id.slice(1)) : (c.id === "p3" || c.id === "p4") ? t("short." + c.id + "." + c.variant) : t("short." + c.id);

let G = null;
const UI = { screen: "lang", tab: "eval", sortKey: "auto", sortDesc: true, sel: null, rolling: false, anim: {}, longpress: false, slide: 0,
  setup: { n: 2, names: [], variant: "classic" } };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const decSep = () => LANG === "en" ? "." : ",";
const fmtNum = x => x.toFixed(1).replace(".", decSep());
const pctUnit = () => (LANG === "en" || LANG === "it") ? "%" : "\u00a0%";
const fmtPct = p => p >= 0.99995 ? "100" + pctUnit() : p <= 0.00005 ? "0" + pctUnit() : (p * 100).toFixed(1).replace(".", decSep()) + pctUnit();
const fmtW = x => Math.abs(x) < 0.05 ? "0" + decSep() + "0" : (x > 0 ? "+" : "\u2212") + fmtNum(Math.abs(x));
const fmtRec = rec => rec.length === 0 ? t("rec.rerollAll") : rec.length === 5 ? t("rec.keepAll") : t("rec.keep", rec.join(" "));
const chipClass = (w, muted) => muted ? "muted" : w > 0.05 ? "good" : w < -0.05 ? "bad" : "neutral";
const vName = v => t("variant." + v + ".name");

const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
function dieSVG(v, state) {
  const locked = state === "locked", empty = v === 0;
  let s = '<svg viewBox="0 0 100 100" aria-hidden="true">';
  if (empty) s += '<rect x="4" y="4" width="92" height="92" rx="19" fill="#264c42" stroke="#58867a" stroke-width="4" stroke-dasharray="9 7"/><text x="50" y="66" text-anchor="middle" font-size="46" font-weight="700" fill="#8fb5aa" font-family="Roboto,sans-serif">?</text>';
  else {
    s += '<rect x="4" y="4" width="92" height="92" rx="19" fill="' + (locked ? "#fff6e9" : "#f7f2e4") + '" stroke="' + (locked ? "#c4402f" : "#cdc5aa") + '" stroke-width="' + (locked ? 6 : 3) + '"/>';
    for (const k of PIPS[v]) s += '<circle cx="' + (26 + 24 * (k % 3)) + '" cy="' + (26 + 24 * Math.floor(k / 3)) + '" r="8.6" fill="#1e1e22"/>';
    if (locked) s += '<circle cx="86" cy="14" r="12" fill="#c4402f"/><circle cx="86" cy="14" r="5" fill="#fff6e9"/>';
  }

}

function setupDice() { return '<div class="dicerow">' + [5,5,5,5,5].map(v => dieSVG(v, "normal")).join("") + "</div>"; }

    h += '</div><div class="row2"><button class="btn felt wide" data-act="tolang">' + esc(t("back")) + '</button><button class="btn gold wide" data-act="tonames">' + esc(t("next")) + "</button></div>";

/* ---------- Aktionen ---------- */
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
function setDie(v) {
  const g = G; if (isFinished(g) || UI.rolling) return;
  if (UI.sel !== null) { g.dice[UI.sel] = v; UI.sel = null; }
  else { const i = g.dice.indexOf(0); if (i < 0) return; g.dice[i] = v; }
  update();
}
function toggleKeep(i) { const g = G; if (isFinished(g) || UI.rolling || !isComplete(g) || 3 - g.rollNo <= 0) return; g.keep[i] = !g.keep[i]; update(); }
function prepareNextRoll() { const g = G; g.frozen = g.keep.slice(); g.dice = g.dice.map((v, i) => g.keep[i] ? v : 0); g.keep = [false,false,false,false,false]; g.rollNo++; UI.sel = null; }
function reroll() { const g = G; if (UI.rolling || !isComplete(g) || g.rollNo >= 3 || g.keep.every(Boolean)) return; prepareNextRoll(); update(); }
function resetTurn() { if (UI.rolling) return; Object.assign(G, blankTurn()); UI.sel = null; update(); }
function digitalRoll() {
  const g = G; if (isFinished(g) || UI.rolling) return;
  if (isComplete(g)) { if (3 - g.rollNo <= 0 || g.keep.every(Boolean)) return; prepareNextRoll(); }
  const empties = []; g.dice.forEach((v, i) => { if (v === 0) empties.push(i); }); if (!empties.length) return;
  const fin = {}; empties.forEach(i => fin[i] = 1 + Math.floor(Math.random() * 6));
  UI.rolling = true; UI.sel = null; UI.anim = {}; let step = 0;
  const tick = () => {
    if (step < 9) { UI.anim = {}; empties.forEach(i => UI.anim[i] = 1 + Math.floor(Math.random() * 6)); step++; renderPanel(); vibrate(8); setTimeout(tick, 70); }
    else { UI.anim = {}; UI.rolling = false; empties.forEach(i => g.dice[i] = fin[i]); vibrate(25); update(); }
  };
  tick();
}
function applyRec(cid) {
  const g = G, r = 3 - g.rollNo; if (UI.rolling || !isComplete(g) || r <= 0) return;
  const s = SIDX.get([...g.dice].sort((a, b) => a - b).join("")), rec = KEPT_ARR.get(tableFor(catOf(g, cid)).B[r][s]), keep = [false,false,false,false,false];
  for (const v of rec) { for (let i = 0; i < 5; i++) if (g.dice[i] === v && !keep[i]) { keep[i] = true; break; } }
  g.keep = keep; update();
}
function commit(cid, strike) {
  const g = G; if (UI.rolling || isFinished(g) || !isComplete(g)) return;
  const cat = catOf(g, cid), p = g.players[g.current]; if (cid in p.scores) return;
  const pts = strike ? 0 : cat.score([...g.dice].sort((a, b) => a - b));
  p.scores[cid] = [pts, !!(strike || pts === 0)]; g.history.push([g.current, cid]);
  const who = p.name; g.current = (g.current + 1) % g.players.length; Object.assign(g, blankTurn()); UI.sel = null; closeSheet();
  update(); window.scrollTo(0, 0);
  toast(strike || pts === 0 ? t("toast.struck", who, catName(cat)) : t("toast.scored", who, catName(cat), pts), true);
}
function undo() {
  const g = G; if (UI.rolling || !g.history.length) return;
  const [pi, cid] = g.history.pop(); delete g.players[pi].scores[cid]; g.current = pi; Object.assign(g, blankTurn()); UI.sel = null; closeSheet(); update();
  $("toast").classList.remove("show");
}
function askNewGame() {

function explain() {

  openSheet("<h3>" + esc(t("chip.info")) + "</h3><dl>" + ["now", "chance", "avg", "rating", "rec", "sel", "order", "sort", "swipe"].map(item).join("") + '</dl><button class="btn soft" data-act="closesheet">' + esc(t("close")) + "</button>");

/* ---------- Ereignisse ---------- */
let lpTimer = null;
document.addEventListener("pointerdown", e => {
  const d = e.target.closest(".die"); if (!d) return; UI.longpress = false; clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { if (!G || UI.rolling || isFinished(G)) return; UI.longpress = true; const i = +d.dataset.i; UI.sel = UI.sel === i ? null : i; vibrate(20); renderPanel(); }, 450);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev => document.addEventListener(ev, () => clearTimeout(lpTimer)));

/* Wischen zwischen Auswertung und Punkteblock */
let swp = null;
document.addEventListener("touchstart", e => {
  swp = null; if (UI.screen !== "game" || !G || e.touches.length !== 1) return;
  const el = e.target; if (!el.closest || !el.closest("#content") || el.closest(".sortrow")) return;
  const bw = el.closest(".boardwrap"); if (bw && bw.scrollWidth > bw.clientWidth + 2) return;
  const p = e.touches[0]; swp = { x: p.clientX, y: p.clientY, t: Date.now() };
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!swp) return; const p = e.changedTouches[0], dx = p.clientX - swp.x, dy = p.clientY - swp.y, dt = Date.now() - swp.t; swp = null;
  if (Math.abs(dx) >= 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && dt < 800) swipeTab(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener("touchcancel", () => { swp = null; }, { passive: true });

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act;
  switch (a) {
    case "setlang": setLang(el.dataset.l); break;
    case "tolang": UI.screen = "lang"; renderStart(); break;
    case "tocount": UI.screen = "start"; renderStart(); break;
    case "count": UI.setup.n = +el.dataset.n; renderStart(); break;
    case "tonames": UI.screen = "names"; renderStart(); break;
    case "tostart": UI.setup.names = readNames(); UI.screen = "start"; renderStart(); break;
    case "tovariant": UI.setup.names = readNames(); UI.screen = "variant"; renderStart(); break;
    case "tonames2": UI.screen = "names"; renderStart(); break;
    case "variant": UI.setup.variant = el.dataset.v; renderStart(); break;
    case "startgame": G = newGame(UI.setup.names, UI.setup.variant); UI.sortKey = "auto"; UI.sortDesc = true; UI.tab = "eval"; UI.screen = "game"; saveGame(); renderGame(); break;
    case "resume": UI.screen = "game"; renderGame(); break;
    case "freshgame": clearSave(); G = null; UI.screen = "lang"; renderStart(); break;
    case "die": { if (UI.longpress) { UI.longpress = false; break; } const i = +el.dataset.i, g = G;
      if (UI.rolling || isFinished(g)) break;
      if (!isComplete(g)) { UI.sel = UI.sel === i ? null : i; renderPanel(); } else toggleKeep(i); break; }
    case "pad": setDie(+el.dataset.k); break;
    case "digital": digitalRoll(); break;
    case "reroll": reroll(); break;
    case "resetturn": resetTurn(); break;
    case "tab": { const nt = el.dataset.t; if (nt !== UI.tab) { UI.slide = nt === "board" ? 1 : -1; UI.tab = nt; renderContent(); } break; }
    case "sort": { const k = el.dataset.k; if (k === UI.sortKey) UI.sortDesc = !UI.sortDesc; else { UI.sortKey = k; UI.sortDesc = k !== "name"; } renderContent(); break; }
    case "explain": explain(); break;
    case "rec": applyRec(el.dataset.cat); break;
    case "enter": commit(el.dataset.cat, false); break;
    case "strike": commit(el.dataset.cat, true); break;
    case "cell": cellSheet(el.dataset.cat); break;
    case "undo": undo(); break;
    case "newgame": askNewGame(); break;
    case "newyes": newGameConfirmed(); break;
    case "closesheet": closeSheet(); break;
    case "langmenu": langSheet(); break;
    case "menu": openSheet("<h3>" + esc(t("menu.title")) + '</h3><button class="btn ink" data-act="undo"' + (G.history.length ? "" : " disabled") + ">" + esc(t("undo.long")) + '</button><button class="btn soft" data-act="explain">' + esc(t("menu.explain")) + '</button><button class="btn soft" data-act="langmenu">' + esc(t("menu.lang")) + '</button><button class="btn soft" data-act="newgame">' + esc(t("newGame")) + '</button><button class="btn soft" data-act="closesheet">' + esc(t("close")) + "</button>"); break;
  }
});
document.addEventListener("keydown", e => { if (UI.screen === "game" && G && /^[1-6]$/.test(e.key) && !(e.target && e.target.tagName === "INPUT")) setDie(+e.key); });

/* ---------- Start ---------- */
(function init() {
  LANG = detectLang(); document.documentElement.lang = LANG; document.title = t("app.title");
  const saved = loadGame();
  if (saved && !isFinished(saved) && saved.players.some(p => Object.keys(p.scores).length)) { G = saved; UI.screen = "resume"; } else { UI.screen = "lang"; }
  renderStart();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
